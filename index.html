<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elaa Zarmadini — Ingénieure Mobile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">

<style>
/* ===== TON CSS ORIGINAL (INCHANGÉ) ===== */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
--bg:#0a0a0f;
--bg2:#111118;
--bg3:#16161f;
--border:rgba(255,255,255,0.07);
--border2:rgba(255,255,255,0.12);
--text:#f0eee8;
--text2:#8a8799;
--text3:#5a5870;
--accent:#7c6ff7;
--accent2:#a99cf5;
--accent-dim:rgba(124,111,247,0.12);
--teal:#2dd4a8;
--teal-dim:rgba(45,212,168,0.1);
--coral:#f07060;
--coral-dim:rgba(240,112,96,0.1);
--amber:#f0b040;
--amber-dim:rgba(240,176,64,0.1);
--green:#6dbf67;
--green-dim:rgba(109,191,103,0.1);
--font-display:'Syne',sans-serif;
--font-body:'DM Sans',sans-serif;
--radius:12px;
--radius-sm:8px;
--radius-pill:100px;
}

body {
background:var(--bg);
color:var(--text);
font-family:var(--font-body);
overflow-x:hidden;
}

/* ===== MODAL (AJOUT UNIQUEMENT) ===== */

.modal {
position:fixed;
inset:0;
background:rgba(10,10,15,0.92);
backdrop-filter:blur(12px);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
padding:2rem;
}

.modal-box {
max-width:950px;
width:100%;
background:var(--bg2);
border:1px solid var(--border);
border-radius:var(--radius);
padding:1rem;
position:relative;
}

.modal-close {
position:absolute;
top:10px;
right:15px;
font-size:30px;
cursor:pointer;
color:var(--text2);
}

.modal-close:hover { color:var(--text); }

.modal-slider {
display:flex;
gap:12px;
overflow-x:auto;
scroll-snap-type:x mandatory;
padding-bottom:10px;
}

.modal-slider img {
height:520px;
border-radius:12px;
flex-shrink:0;
scroll-snap-align:center;
border:1px solid var(--border);
}

/* garde scroll smooth */
html { scroll-behavior:smooth; }

</style>
</head>

<body>

<!-- ===== TON SITE ORIGINAL (UNIQUEMENT PROJECT MODIFIÉ) ===== -->

<section id="projets">
<div class="container">

<div class="projects-grid">

<!-- MaidsApp -->
<div class="proj-card c-teal fade-in"
data-images="assets/MaidsApp1.png,assets/MaidsApp2.png">
<div class="proj-name">MaidsApp</div>
</div>

<!-- YouGo Travel -->
<div class="proj-card c-amber fade-in"
data-images="assets/YouGoTravel1.png,assets/YouGoTravel2.png">
<div class="proj-name">YouGo Travel</div>
</div>

<!-- MomentCast -->
<div class="proj-card c-teal fade-in"
data-images="assets/MomentCast1.png,assets/MomentCast2.png,assets/MomentCast3.png">
<div class="proj-name">MomentCast</div>
</div>

<!-- Gestion des tâches -->
<div class="proj-card c-purple fade-in"
data-images="assets/GestionTache1.png,assets/GestionTache2.png">
<div class="proj-name">Gestion des tâches</div>
</div>

<!-- Tunisair -->
<div class="proj-card c-purple fade-in"
data-images="assets/Tunisair1.png,assets/Tunisair2.png">
<div class="proj-name">Tunisair Portail</div>
</div>

<!-- EDUFY -->
<div class="proj-card c-coral fade-in"
data-images="assets/EDUFY1.png,assets/EDUFY2.png">
<div class="proj-name">EDUFY</div>
</div>

</div>
</div>
</section>

<!-- ===== MODAL ===== -->
<div class="modal" id="modal">
<div class="modal-box">
<div class="modal-close" id="closeModal">&times;</div>
<div class="modal-slider" id="modalSlider"></div>
</div>
</div>

<!-- ===== JS ===== -->
<script>
const modal = document.getElementById("modal");
const slider = document.getElementById("modalSlider");
const closeBtn = document.getElementById("closeModal");

document.querySelectorAll(".proj-card").forEach(card => {
card.addEventListener("click", () => {

const images = card.getAttribute("data-images");
if (!images) return;

slider.innerHTML = "";

images.split(",").forEach(img => {
const el = document.createElement("img");
el.src = img.trim();
slider.appendChild(el);
});

modal.style.display = "flex";
});
});

closeBtn.onclick = () => modal.style.display = "none";

modal.onclick = (e) => {
if (e.target === modal) modal.style.display = "none";
};
</script>

</body>
</html>
