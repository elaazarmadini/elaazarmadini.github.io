<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elaa Zarmadini — Ingénieure en Informatique — Dev Mobile</title>

<!-- (TON CSS ORIGINAL RESTE INCHANGÉ ICI) -->
<style>
/* ====== TON CSS EXISTANT (inchangé) ====== */

/* MODAL STYLE (AJOUTÉ) */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 20px;
}

.modal-content {
  background: #111;
  padding: 15px;
  border-radius: 12px;
  max-width: 900px;
  width: 100%;
  display: flex;
  gap: 10px;
  overflow-x: auto;
}

.modal-content img {
  width: 280px;
  border-radius: 10px;
  object-fit: cover;
}

.modal-close {
  position: absolute;
  top: 20px;
  right: 20px;
  color: white;
  font-size: 28px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- ===== TON HTML EXISTANT ===== -->

<!-- PROJECTS -->
<section id="projets">
  <div class="container">

    <div class="projects-grid">

      <!-- MaidsApp -->
      <div class="proj-card c-teal fade-in"
        data-images="assets/MaidsApp1.PNG,assets/MaidsApp2.PNG">
        <div class="proj-name">MaidsApp</div>
      </div>

      <!-- YouGo Travel -->
      <div class="proj-card c-amber fade-in"
        data-images="assets/YouGoTravel1.PNG,assets/YouGoTrave2.PNG">
        <div class="proj-name">YouGo Travel</div>
      </div>

      <!-- MomentCast -->
      <div class="proj-card c-teal fade-in"
        data-images="assets/MomentCast1.PNG,assets/MomentCast2.PNG,assets/MomentCast3.PNG">
        <div class="proj-name">MomentCast</div>
      </div>

      <!-- Gestion Tache -->
      <div class="proj-card c-purple fade-in"
        data-images="assets/gestionTache1.PNG,assets/gestionTache2.PNG">
        <div class="proj-name">Gestion des tâches</div>
      </div>

    </div>
  </div>
</section>

<!-- ===== MODAL POPUP ===== -->
<div class="modal" id="modal">
  <span class="modal-close" id="closeModal">&times;</span>
  <div class="modal-content" id="modalContent"></div>
</div>

<!-- ===== SCRIPT ===== -->
<script>
const modal = document.getElementById("modal");
const modalContent = document.getElementById("modalContent");
const closeModal = document.getElementById("closeModal");

document.querySelectorAll(".proj-card").forEach(card => {
  card.addEventListener("click", () => {
    const images = card.getAttribute("data-images").split(",");

    modalContent.innerHTML = "";

    images.forEach(img => {
      const image = document.createElement("img");
      image.src = img.trim();
      modalContent.appendChild(image);
    });

    modal.style.display = "flex";
  });
});

closeModal.onclick = () => {
  modal.style.display = "none";
};

modal.onclick = (e) => {
  if (e.target === modal) modal.style.display = "none";
};
</script>

</body>
</html>
